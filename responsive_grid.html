<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Services</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
</head>

<style>
  .service-box {
    padding: 30px;
    margin-top: 30px;
    text-align: center;
    border-radius: 10px;
  }
</style>

<body>

  <div class="container my-5">

    <h2 class="text-center mb-4">Student Services</h2>

    <div class="row">

      <div class="col-12 col-md-6 col-lg-4">
        <div class="service-box bg-primary text-white">
          <h4>Library</h4>
          <p>Find books and study materials.</p>
          <button class="btn btn-light">Explore</button>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="service-box bg-success text-white">
          <h4>Study Room</h4>
          <p>Book a quiet place for studying.</p>
          <button class="btn btn-light">Book Now</button>
        </div>
      </div>

      <div class="col-12 col-md-6 col-lg-4">
        <div class="service-box bg-warning">
          <h4>Student Support</h4>
          <p>Get help with your academic needs.</p>
          <button class="btn btn-dark">Get Help</button>
        </div>
      </div>

    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous">
  </script>

</body>

</html>
