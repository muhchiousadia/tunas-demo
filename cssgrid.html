<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      border: 5px solid #6a1b9a;
      background-color: #f3e5f5;
      margin: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 2fr 1fr;
      row-gap: 10px;
      column-gap: 15px;
      padding: 15px;
    }

    .grid div {
      padding: 35px;
      text-align: center;
      font-size: 25px;
    }

    .header {
      border: 4px dotted #4a148c;
      background-color: #8e44ad;
      grid-area: 1 / 1 / span 1 / span 3;
      position: sticky;
      top: 0;
      z-index: 1;
    }

    .menu {
      border: 4px dotted #1565c0;
      background-color: #64b5f6;
      grid-column: 1 / 2;
      grid-row: 2 / 4;
    }

    .main {
      border: 4px dotted #00838f;
      background-color: #4dd0e1;
      grid-column: 2 / 3;
      grid-row: 2 / 3;
    }

    .sidebar {
      border: 4px dotted #ef6c00;
      background-color: #ffb74d;
      grid-column: 3 / 4;
      grid-row: 2 / 3;
    }

    .content {
      border: 4px dotted #2e7d32;
      background-color: #81c784;
      grid-column: 2 / 4;
      grid-row: 3 / 4;
    }

    .gallery {
      border: 4px dotted #c62828;
      background-color: #ef9a9a;
      grid-column: 1 / 3;
      grid-row: 4 / 5;
    }

    .notice {
      border: 4px dotted #6a1b9a;
      background-color: #ce93d8;
      grid-column: 3 / 4;
      grid-row: 4 / 5;
    }

    .footer {
      border: 4px dotted #37474f;
      background-color: #546e7a;
      color: white;
      grid-column: 1 / 4;
      grid-row: 5 / 6;
    }
  </style>

</head>

<body>

  <div class="grid">

    <div class="header">Header</div>

    <div class="menu">Menu</div>

    <div class="main">Main</div>

    <div class="sidebar">Sidebar</div>

    <div class="content">Content</div>

    <div class="gallery">Gallery</div>

    <div class="notice">Notice</div>

    <div class="footer">Footer</div>

  </div>

</body>

</html>
